<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Se dibuja a la mitad del tamaño final y se captura al doble: 2622 × 1475 × 2 = 5244 × 2950. */
  body {
    width: 2622px; height: 1475px; overflow: hidden;
    background: #0d1117;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #e8eaed;
    display: grid; grid-template-columns: 1.05fr 1fr; align-items: center;
    position: relative;
  }

  /* El azul de la marca, detrás, como luz y no como fondo plano. */
  body::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(900px 700px at 18% 30%, rgba(31,111,235,.35), transparent 65%),
      radial-gradient(900px 900px at 85% 75%, rgba(18,66,147,.45), transparent 60%);
  }

  /* Rejilla de taller, tenue, para que el fondo no sea un vacío. */
  body::after {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 90px 90px;
    mask-image: radial-gradient(1400px 900px at 30% 50%, #000 40%, transparent 85%);
  }

  .texto { position: relative; z-index: 1; padding: 0 0 0 190px; }

  .logo { height: 96px; margin-bottom: 70px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 148px; line-height: 1.02; letter-spacing: -.035em;
  }

  h1 .azul { color: #6ba4ff; }

  p {
    margin-top: 44px; font-size: 54px; line-height: 1.35; color: #aab2c0;
    max-width: 17ch;
  }

  .pastillas { margin-top: 70px; display: flex; gap: 20px; flex-wrap: wrap; max-width: 1160px; }

  .pastilla {
    padding: 16px 30px; border: 2px solid rgba(255,255,255,.22); border-radius: 999px;
    font-size: 34px; color: #cfd6e2; white-space: nowrap;
  }

  /* Los teléfonos: el de atrás girado, el de adelante al frente y recortado por el borde. */
  .telefonos { position: relative; z-index: 1; height: 100%; }

  .telefono {
    position: absolute; border-radius: 76px; overflow: hidden;
    border: 14px solid #1c2128;
    box-shadow: 0 80px 120px rgba(0,0,0,.55);
    background: #000;
  }

  .telefono img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .atras { width: 590px; height: 1280px; top: 220px; left: 10px; rotate: -7deg; opacity: .92; }
  .frente { width: 650px; height: 1410px; top: 150px; left: 530px; rotate: 4deg; }
</style>
</head>
<body>
  <div class="texto">
    <img class="logo" src="../../../web/public/brand/garajapp-horizontal-blanco.svg" alt="GarajApp">
    <h1>El taller,<br><span class="azul">en orden</span></h1>
    <p>Órdenes, repuestos, cotizaciones y citas.</p>
    <div class="pastillas">
      <span class="pastilla">Órdenes de trabajo</span>
      <span class="pastilla">Inventario</span>
      <span class="pastilla">Citas</span>
      <span class="pastilla">Facturación</span>
    </div>
  </div>

  <div class="telefonos">
    <div class="telefono atras"><img src="../capturas-6.9/3-reportes.png" alt=""></div>
    <div class="telefono frente"><img src="../capturas-6.9/1-bandeja.png" alt=""></div>
  </div>
</body>
</html>
