<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Resultados de la búsqueda: 3:2. Se dibuja a 1920 × 1280 y se captura al doble, que da
     3840 × 2560, el máximo que acepta App Store Connect. */
  body {
    width: 1920px; height: 1280px; overflow: hidden;
    background: #0d1117;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #e8eaed;
    display: grid; grid-template-columns: 1fr 860px; align-items: center;
    position: relative;
  }

  body::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(760px 620px at 16% 34%, rgba(31,111,235,.35), transparent 65%),
      radial-gradient(800px 800px at 82% 76%, rgba(18,66,147,.45), transparent 60%);
  }

  body::after {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(1100px 800px at 28% 50%, #000 40%, transparent 85%);
  }

  .texto { position: relative; z-index: 1; padding-left: 140px; }

  .logo { height: 76px; margin-bottom: 54px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 118px; line-height: 1.02; letter-spacing: -.035em;
  }

  h1 .azul { color: #6ba4ff; }

  p { margin-top: 36px; font-size: 44px; line-height: 1.35; color: #aab2c0; max-width: 16ch; }

  .pastillas { margin-top: 54px; display: flex; gap: 18px; flex-wrap: wrap; max-width: 760px; }

  .pastilla {
    padding: 14px 26px; border: 2px solid rgba(255,255,255,.22); border-radius: 999px;
    font-size: 30px; color: #cfd6e2; white-space: nowrap;
  }

  .telefonos { position: relative; z-index: 1; height: 100%; }

  .telefono {
    position: absolute; border-radius: 62px; overflow: hidden;
    border: 12px solid #1c2128;
    box-shadow: 0 70px 110px rgba(0,0,0,.55);
    background: #000;
  }

  .telefono img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }

  /* La rotación saca las esquinas hacia afuera: hay que dejarles aire o se recortan contra
     el borde del lienzo. */
  .atras { width: 425px; height: 925px; top: 195px; left: 0; rotate: -7deg; opacity: .92; }
  .frente { width: 470px; height: 1020px; top: 145px; left: 320px; rotate: 4deg; }
</style>
</head>
<body>
  <div class="texto">
    <img class="logo" src="../../../web/public/brand/garajapp-horizontal-blanco.svg" alt="GarajApp">
    <h1>El taller,<br><span class="azul">en orden</span></h1>
    <p>Órdenes, repuestos, cotizaciones y citas.</p>
    <div class="pastillas">
      <span class="pastilla">Órdenes</span>
      <span class="pastilla">Inventario</span>
      <span class="pastilla">Citas</span>
      <span class="pastilla">Facturación</span>
    </div>
  </div>

  <div class="telefonos">
    <div class="telefono atras"><img src="../capturas-6.9/2-orden.png" alt=""></div>
    <div class="telefono frente"><img src="../capturas-6.9/1-bandeja.png" alt=""></div>
  </div>
</body>
</html>
