name: garaj_app
description: "GarajApp — gestión de taller mecánico para autos y motos."
publish_to: 'none'

# En Android build-name es versionName y build-number es versionCode; en iOS son
# CFBundleShortVersionString y CFBundleVersion. El de la tienda se pasa al compilar con
# --build-name / --build-number, así que este valor solo manda en las compilaciones locales.
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.2
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  # Solo para recordar que el recorrido de bienvenida ya se vio. Va en las preferencias del
  # sistema y no en el almacén seguro: no es un secreto y no debe sobrevivir a desinstalar.
  shared_preferences: ^2.3.5
  # La hoja de compartir del sistema. Es como sale del teléfono la factura en PDF: el
  # endpoint va con la sesión puesta, así que el archivo se baja aquí y se comparte —a
  # WhatsApp, al correo o a la impresora— en vez de abrir una URL que respondería 401.
  share_plus: ^12.0.2
  # Push. La app funciona sin proyecto de Firebase: si faltan `google-services.json` o
  # `GoogleService-Info.plist`, la inicialización falla, se registra y todo lo demás sigue
  # igual —los avisos se guardan en la API y se ven en la campana—. Ver docs/push.md.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

  # Generan los iconos de lanzador y las pantallas de arranque nativas a partir de un PNG.
  # Se corren a mano cuando cambia la marca; lo que generan sí se versiona.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Space Grotesk para la marca y los titulares; IBM Plex Sans para la interfaz; IBM Plex
  # Mono para folios, cantidades y montos, donde las cifras tienen que alinearse por la coma.
  # Van empaquetadas y no descargadas en tiempo de ejecución: en el taller la señal es mala
  # y la aplicación no puede quedarse esperando una fuente para dibujar la primera pantalla.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# ---------------------------------------------------------------------------
# Icono de lanzador. `flutter pub run flutter_launcher_icons`
#
# En Android el icono adaptativo va en dos capas —fondo azul plano y tuerca encima— porque
# cada lanzador aplica su propia máscara: redonda, cuadrada o de gota. La imagen de primer
# plano ya viene con el margen de la zona segura; sin él, un lanzador redondo recorta las
# puntas de la tuerca.
flutter_launcher_icons:
  image_path: assets/brand/icono.png
  android: true
  adaptive_icon_background: "#1F6FEB"
  adaptive_icon_foreground: assets/brand/icono-adaptativo.png
  # iOS recorta con su propia máscara y no admite transparencia, así que recibe la versión
  # a sangre: con las esquinas ya redondeadas del PNG de marca, lo que queda fuera se aplana
  # a blanco y asoma como un filo claro alrededor del icono.
  ios: true
  image_path_ios: assets/brand/icono-ios.png
  remove_alpha_ios: true

# ---------------------------------------------------------------------------
# Pantalla de arranque nativa. `dart run flutter_native_splash:create`
#
# Es lo que dibuja el sistema antes de que Flutter arranque. Sin ella el primer instante es
# un rectángulo blanco, y en un teléfono modesto ese instante dura lo suficiente para verse.
flutter_native_splash:
  color: "#1F6FEB"
  image: assets/brand/isotipo-blanco.png
  android_12:
    # Android 12+ recorta el icono de arranque en un círculo y lo dibuja centrado: la imagen
    # con margen es la que sobrevive a ese recorte.
    image: assets/brand/icono-adaptativo.png
    color: "#1F6FEB"
  # Mismo azul en oscuro: la marca no cambia de color con el tema del teléfono.
  color_dark: "#1F6FEB"
  image_dark: assets/brand/isotipo-blanco.png
  android: true
  ios: true
