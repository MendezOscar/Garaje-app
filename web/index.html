<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GarajApp — El taller ordenado, desde el teléfono</title>
    <meta name="description" content="Órdenes de trabajo, inventario, cotizaciones por WhatsApp y cobro para talleres de autos y motos, desde el teléfono." />

    <!-- La tarjeta que aparece al pegar el enlace en WhatsApp, que es por donde va a viajar.
         Sin og:image el enlace sale como texto pelado y nadie lo abre. La imagen tiene que
         ser una URL absoluta: WhatsApp no resuelve rutas relativas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GarajApp" />
    <meta property="og:locale" content="es_HN" />
    <meta property="og:title" content="GarajApp — El taller ordenado, desde el teléfono" />
    <meta
      property="og:description"
      content="Órdenes de trabajo, inventario, cotizaciones por WhatsApp y cobro para talleres de autos y motos."
    />
    <meta property="og:url" content="https://garaje-app.pages.dev/" />
    <meta property="og:image" content="https://garaje-app.pages.dev/brand/og-garajapp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://garaje-app.pages.dev/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/garajapp-icono-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- El azul de marca pinta la barra del navegador en Android y la de estado en iOS
         cuando la aplicación se agrega a la pantalla de inicio. -->
    <meta name="theme-color" content="#1F6FEB" />

    <!-- preconnect antes del link de fuentes: ahorra el viaje de DNS y TLS a gstatic, que
         es donde están los .woff2 de verdad. Sin él la marca aparece un parpadeo tarde. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
