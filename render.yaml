# Blueprint de Render: la especificación de los servicios, para poder reconstruirlos.
#
# OJO, no lo sincronice sobre el workspace actual: los dos servicios se crearon a mano desde el
# dashboard, y Render no adopta servicios existentes al aplicar un blueprint —los crea de nuevo—,
# así que un Sync duplicaría producción. Sirve como referencia de qué lleva cada servicio, y para
# levantar todo de cero en un workspace vacío.
#
# Los valores con `sync: false` NO se guardan en el repo: se cargan a mano en el dashboard.

services:
  - type: web
    name: garaje-app
    runtime: docker
    # Starter (US$7/mes): en el plan gratis el servicio se duerme a los 15 minutos y el primer
    # acceso del día tardaba ~50 s en responder. Además así las 750 horas gratis del workspace
    # quedan íntegras para el servicio de pruebas.
    plan: starter
    # Virginia: la región de Render más cercana a Honduras y la misma en la que está el
    # proyecto de Supabase (us-east-1). Que API y base coincidan importa más que nada:
    # una pantalla hace varias consultas y cada una cruzaría el país si no.
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # En Render no hay paso de release aparte: las migraciones se aplican al arrancar.
      - key: Database__MigrateOnStartup
        value: "true"

      # Cadena de Supabase. Use el Session pooler (puerto 5432), no el Transaction pooler:
      # el modo transacción de pgbouncer rompe las sentencias preparadas de Npgsql.
      - key: ConnectionStrings__Default
        sync: false

      # Render la genera una vez y la conserva entre despliegues. Si la cambia, todas las
      # sesiones activas quedan invalidadas.
      - key: Jwt__SigningKey
        generateValue: true

      # URL del panel web en Cloudflare Pages, ej. https://garaj.pages.dev
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: PublicBaseUrl
        sync: false

      # Cloudflare R2 (se usa a partir de la Fase 2).
      - key: Storage__ServiceUrl
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false
      - key: Storage__Bucket
        value: garaj-media

      # ---------------------------------------------------------- portón de versión
      #
      # Hasta qué versión de la app se le sigue hablando. Son **compilaciones** —el `+12` de
      # `1.3.0+12`—, no versiones.
      #
      #   RecommendedBuild  por debajo, una franja arriba que se puede cerrar; se sigue
      #                     trabajando. Lleva la última compilación publicada, puesta unos
      #                     días después de publicarla, cuando las consolas muestran que la
      #                     mayoría ya actualizó.
      #
      #   MinimumBuild      por debajo, la app no deja pasar. Lleva la compilación más vieja
      #                     que todavía funciona con esta API, y **casi nunca se mueve**: solo
      #                     cuando algo rompe de verdad la compatibilidad —una migración que
      #                     cambia lo que la app manda, un error que cobra mal—.
      #
      # **En cero no estorban a nadie, y así deben quedarse mientras no haga falta.** Subir el
      # mínimo el mismo día de publicar deja fuera a quien todavía no recibió la versión, y a
      # un teléfono viejo que ya no puede actualizar lo deja sin app: le queda el panel web.
      # Se bajan igual de rápido —cero otra vez— y los teléfonos se enteran en la siguiente
      # petición, sin publicar nada.
      #
      # Van en `sync: false` y no con un valor fijo a propósito: se mueven desde el panel de
      # Render el día que haga falta, y un valor escrito aquí los pisaría en el siguiente
      # despliegue. Sin poner valen cero, que es apagado.
      - key: AppVersion__RecommendedBuild
        sync: false
      - key: AppVersion__MinimumBuild
        sync: false

      # Por qué hay que actualizar, con las palabras del taller. Sale tal cual en la franja y
      # en la pantalla de bloqueo. Vacío deja el texto por defecto.
      - key: AppVersion__Message
        sync: false

  # ------------------------------------------------------------------ pruebas
  # Copia de la API para probar migraciones y cambios antes de que los vea el taller. Sigue la
  # rama `pruebas`: se empuja ahí, se comprueba, y hasta entonces se mezcla a `main`, que es la
  # que despliega producción.
  #
  # Va en `Development` a propósito, y eso tiene tres consecuencias que en producción no
  # existen: se expone Swagger en `/swagger`, la base vacía se siembra sola con los datos de
  # desarrollo (`owner@garaj.test`) —lo que permite entrar y llamar a la siembra de
  # demostración, que necesita un Dueño autenticado— y los errores salen con detalle. Es
  # aceptable porque aquí no hay datos de nadie; no ponga nunca datos reales en este entorno.
  - type: web
    name: garaje-app-pruebas
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    branch: pruebas
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development

      - key: Database__MigrateOnStartup
        value: "true"

      # Su propio proyecto de Supabase. **No** la cadena de producción: las migraciones se
      # aplican al arrancar y una prueba no puede tocar la base del taller.
      - key: ConnectionStrings__Default
        sync: false

      # Distinta de la de producción a propósito: así un token emitido aquí no vale allá.
      - key: Jwt__SigningKey
        generateValue: true

      # Aquí sí, y solo aquí: `POST /api/demo/seed` borra la base entera y vuelve a sembrar el
      # Taller Demo. Es lo que permite refrescar la demostración cuantas veces haga falta sin
      # acercarse a producción.
      - key: Demo__AllowSeeding
        value: "true"

      # URL del panel de pruebas en Pages (el preview de la rama). Ojo: en Development ya hay
      # una lista en appsettings.Development.json, y esta variable **reemplaza el índice 0**,
      # así que aquí va la URL del preview y `localhost:4173` sigue permitido.
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: PublicBaseUrl
        sync: false

      - key: Storage__ServiceUrl
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false

      # Bucket aparte: una siembra de pruebas borra filas y dejaría fotos huérfanas mezcladas
      # con las de producción.
      - key: Storage__Bucket
        value: garaj-media-test
